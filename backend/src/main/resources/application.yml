# ==============================================================
# AI Tip Assistant — Application Configuration
# ==============================================================
# WHY YAML over .properties?
#   - Hierarchical structure is easier to read
#   - Reduces repetitive prefixes
#   - Industry standard for Spring Boot projects
# ==============================================================

server:
  port: 8080

# ==============================================================
# DATABASE CONFIGURATION
# WHY PostgreSQL?
#   - Production-grade RDBMS with excellent JSON support
#   - Required for future AI tip storage features
#   - Flyway manages schema migrations automatically
# ==============================================================
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ==============================================================
  # JPA / HIBERNATE
  # WHY validate?
  #   - Flyway owns DDL. Hibernate only validates the schema
  #     matches entities. Prevents accidental schema drift.
  # ==============================================================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ==============================================================
  # FLYWAY
  # WHY enabled + baseline-on-migrate?
  #   - Automatically applies migrations from db/migration/
  #   - baseline-on-migrate handles existing databases gracefully
  # ==============================================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# ==============================================================
# JWT CONFIGURATION
# WHY environment variable for secret?
#   - NEVER hardcode secrets in source control
#   - ${JWT_SECRET} reads from environment variable
#   - The fallback after ':' is for LOCAL DEVELOPMENT ONLY
#   - Production MUST set JWT_SECRET environment variable
# WHY 24 hours?
#   - Balances user experience (less re-authentication)
#     with security (bounded token lifetime)
# WHY custom prefix 'app.'?
#   - Avoids collision with Spring's own properties
#   - Clearly namespaced as application-specific config
# ==============================================================
app:
  cors:
    frontend-url: ${FRONTEND_URL:https://ai-possibletip.vercel.app}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24 hours in milliseconds
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama3-8b-8192}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
  currency:
    base-url: ${CURRENCY_API_BASE_URL:https://api.frankfurter.dev}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      base-url: ${STRIPE_BASE_URL:https://api.stripe.com}
  pos:
    provider: ${POS_PROVIDER:mock}
    square:
      access-token: ${SQUARE_ACCESS_TOKEN:}
      base-url: ${SQUARE_BASE_URL:https://connect.squareupsandbox.com}
  restaurant:
    provider: ${RESTAURANT_PROVIDER:mock}
    google:
      api-key: ${GOOGLE_PLACES_API_KEY:}
      base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com/v1/places:searchText}

# ==============================================================
# LOGGING
# ==============================================================
logging:
  level:
    com.aitip: DEBUG
    org.springframework.security: INFO
