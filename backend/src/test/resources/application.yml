# ==============================================================
# AI Tip Assistant — Test Application Configuration
# ==============================================================

server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/aitip_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:4a6f686e446f6553757065725365637265744b6579466f724a5754417574686e3230323421}
    expiration-ms: 86400000  # 24 hours in milliseconds
  groq:
    api-key: ${GROQ_API_KEY:dummy_key}
    model: ${GROQ_MODEL:llama3-8b-8192}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
  currency:
    base-url: ${CURRENCY_API_BASE_URL:https://api.frankfurter.dev}
  payment:
    provider: mock
    stripe:
      secret-key: test_key
      base-url: http://localhost:8089
  pos:
    provider: mock
    square:
      access-token: test_token
      base-url: http://localhost:8089
  restaurant:
    provider: mock
    google:
      api-key: test_key
      base-url: http://localhost:8089

logging:
  level:
    com.aitip: DEBUG
    org.springframework.security: INFO
